<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Comparison Tool</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    color:#38bdf8;
    margin-bottom:15px;
}

p{
    color:#d1d5db;
}

input{
    width:350px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#1f2937;
    color:white;
    outline:none;
}

input::placeholder{
    color:#9ca3af;
}

button{
    padding:12px 20px;
    background:#0077ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-left:10px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#005fd1;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-top:30px;
}

.box{
    background:#111827;
    padding:20px;
    border-radius:15px;
    border:1px solid #374151;
    box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

.box h2{
    color:#38bdf8;
    margin-bottom:10px;
}

.box p{
    color:#d1d5db;
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:#111827;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    border:1px solid #374151;
    padding:12px;
    color:#d1d5db;
}

th{
    background:#0077ff;
    color:white;
}

tr:nth-child(even){
    background:#1f2937;
}

tr:nth-child(odd){
    background:#111827;
}

tr:hover{
    background:#374151;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }

    input{
        width:100%;
        margin-bottom:10px;
    }

    button{
        margin-left:0;
        width:100%;
    }
}

</style>
</head>
<body>

<h1>DSA Comparison Tool</h1>

<p>Enter numbers separated by commas</p>

<input type="text" id="numbers" placeholder="1,2,3,4,5,6">
<button onclick="compareDSA()">Compare</button>

<div class="container">

    <div class="box">
        <h2>Array</h2>
        <p id="arrayResult">-</p>
    </div>

    <div class="box">
        <h2>Linked List</h2>
        <p id="linkedResult">-</p>
    </div>

    <div class="box">
        <h2>Stack (LIFO)</h2>
        <p id="stackResult">-</p>
    </div>

    <div class="box">
        <h2>Queue (FIFO)</h2>
        <p id="queueResult">-</p>
    </div>

</div>

<table>
    <tr>
        <th>Data Structure</th>
        <th>Access</th>
        <th>Insertion</th>
        <th>Deletion</th>
    </tr>

    <tr>
        <td>Array</td>
        <td>O(1)</td>
        <td>O(n)</td>
        <td>O(n)</td>
    </tr>

    <tr>
        <td>Linked List</td>
        <td>O(n)</td>
        <td>O(1)</td>
        <td>O(1)</td>
    </tr>

    <tr>
        <td>Stack</td>
        <td>O(n)</td>
        <td>O(1)</td>
        <td>O(1)</td>
    </tr>

    <tr>
        <td>Queue</td>
        <td>O(n)</td>
        <td>O(1)</td>
        <td>O(1)</td>
    </tr>
    </table>
<div style="margin-top:25px;">
    <a href="index.html" class="home-btn">⬅ Back to Home</a>
</div>


<script>
function compareDSA(){

    let input=document.getElementById("numbers").value;

    let arr=input.split(",").map(Number);

    document.getElementById("arrayResult").innerHTML=
        "[" + arr.join(", ") + "]";

    document.getElementById("linkedResult").innerHTML=
        arr.join(" → ") + " → NULL";

    let stack=[...arr].reverse();

    document.getElementById("stackResult").innerHTML=
        stack.join(" → ");

    let queue=[...arr];

    document.getElementById("queueResult").innerHTML=
        queue.join(" → ");
}
</script>

</body>
</html>
